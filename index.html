<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Сканер строительных изделий</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <div class="eyebrow">Сканер изделий</div>
      </div>
      <div id="systemStatus" class="system-status">Запуск…</div>
    </header>

    <section class="camera-card">
      <div id="cameraView" class="camera-view">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>

        <div class="scan-frame" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <div id="scanHint" class="scan-hint">Подготовка камеры…</div>
      </div>
    </section>

    <section id="tagPanel" class="panel hidden">
      <div class="tag-result">
        <div>
          <div class="panel-caption">Обнаружена метка</div>
          <div class="tag-id">ID <span id="tagId">—</span></div>
        </div>
        <div class="detected-badge">Найдена</div>
      </div>

      <h2>Статус изделия</h2>

      <div class="status-grid">
        <button class="status-button arrived" data-status="ARRIVED_ON_SITE" type="button">
          <span class="status-icon">↓</span>
          <span>
            <strong>Прибыло на объект</strong>
            <small>Изделие принято на площадке</small>
          </span>
        </button>

        <button class="status-button installed" data-status="INSTALLED" type="button">
          <span class="status-icon">✓</span>
          <span>
            <strong>Смонтировано</strong>
            <small>Изделие установлено</small>
          </span>
        </button>

        <button class="status-button defect" data-status="DEFECT" type="button">
          <span class="status-icon">!</span>
          <span>
            <strong>Брак</strong>
            <small>Выявлено несоответствие</small>
          </span>
        </button>
      </div>

      <button id="submitButton" class="primary-button" type="button" disabled>
        Подтвердить статус
      </button>
    </section>

    <section id="jsonPanel" class="panel hidden">
      <div class="success-row">
        <div>
          <div class="panel-caption">Mock-запрос сформирован</div>
          <h2>Данные готовы к отправке</h2>
        </div>
        <div class="success-mark">✓</div>
      </div>

      <pre id="jsonOutput" class="json-output"></pre>

      <button id="scanAgainButton" class="secondary-button" type="button">
        Сканировать следующее изделие
      </button>
    </section>

    <section id="errorPanel" class="panel error-panel hidden">
      <h2>Не удалось запустить сканер</h2>
      <p id="errorText"></p>
      <button id="retryButton" class="secondary-button" type="button">Повторить</button>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
