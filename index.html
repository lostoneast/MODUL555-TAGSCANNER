<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <script>
    // HTTPS для рабочего домена; HTTP остаётся доступным для локальной отладки.
    if (window.location.protocol === "http:" &&
        window.location.hostname === "scan555.ru") {
      const secureUrl = new URL(window.location.href);
      secureUrl.protocol = "https:";
      window.location.replace(secureUrl.href);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Сканер строительных изделий</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <div id="systemStatus" class="visually-hidden" role="status">Запуск…</div>

    <div id="startup" class="startup" role="status">
      <span class="startup-spinner" aria-hidden="true"></span>
      <span id="startupText">Подготовка камеры…</span>
    </div>

    <section class="camera-card">
      <div id="cameraView" class="camera-view">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>

        <div class="scan-frame" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <div id="scanHint" class="visually-hidden">Подготовка камеры…</div>
      </div>
    </section>

    <section id="tagPanel" class="panel hidden" aria-label="Статус изделия">
      <div class="status-grid">
        <button class="status-button arrived" data-status="ARRIVED_ON_SITE" type="button">
          <span class="status-icon">↓</span>
          <span>
            <strong>Прибыло на объект</strong>
            <small>Изделие принято на площадке</small>
          </span>
        </button>

        <button class="status-button installed" data-status="INSTALLED" type="button">
          <span class="status-icon">✓</span>
          <span>
            <strong>Смонтировано</strong>
            <small>Изделие установлено</small>
          </span>
        </button>

        <button class="status-button defect" data-status="DEFECT" type="button">
          <span class="status-icon">!</span>
          <span>
            <strong>Брак</strong>
            <small>Выявлено несоответствие</small>
          </span>
        </button>
      </div>

      <div class="scan-actions">
        <button id="submitButton" class="primary-button" type="button" disabled>
          Подтвердить статус
        </button>
        <button id="rescanButton" class="rescan-button" type="button" aria-label="Пересканировать без отправки данных" title="Пересканировать без отправки данных">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
    </section>

    <section id="errorPanel" class="panel error-panel hidden">
      <h2>Не удалось запустить сканер</h2>
      <p id="errorText"></p>
      <button id="retryButton" class="secondary-button" type="button">Повторить</button>
    </section>
  </main>

  <dialog id="locationDialog" class="location-dialog" aria-labelledby="locationTitle" aria-describedby="locationDescription">
    <form method="dialog">
      <h2 id="locationTitle">Добавить местоположение?</h2>
      <p id="locationDescription">Координаты будут переданы вместе со статусом изделия, чтобы зафиксировать место сканирования.</p>
      <button class="primary-button" value="allow" type="submit">Разрешить геолокацию</button>
      <button class="secondary-button" value="skip" type="submit" autofocus>Продолжить без координат</button>
    </form>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
